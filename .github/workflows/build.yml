name: Build & Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v6
    
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.23'
    
    - name: Cache Go modules
      uses: actions/cache@v5
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-
    
    - name: Download dependencies
      run: go mod download
    
    - name: Build
      run: go build -v -o bin/rarclean ./cmd/rarclean
    
    - name: Run tests
      run: go test -v -cover ./...
    
    - name: Run linter
      uses: golangci/golangci-lint-action@v9
      with:
        version: latest
        args: --timeout=5m
    
    - name: Upload binary
      uses: actions/upload-artifact@v7
      with:
        name: rarclean-${{ runner.os }}
        path: bin/rarclean

